<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Shamus Li</title>
        <meta name="description" content="Shamus Li is a PhD student at Cornell University studying computational imaging.">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#000000">
        <meta property="og:title" content="Shamus Li">
        <meta property="og:description" content="Shamus Li is a PhD student at Cornell University studying computational imaging.">
        <link rel="canonical" href="https://shamus.li/">
        <link rel="stylesheet" href="/styles.css">
        <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
        <link rel="prefetch" href="/work/lightfield.webp" as="image">
        <link rel="prefetch" href="/work/qutcc.webp" as="image">
        <script type="speculationrules">
            {"prerender": [{"where": {"href_matches": "/work/"}, "eagerness": "moderate"}]}
        </script>
        <script type="module" src="/src/portrait-light-field.ts"></script>
    </head>
    <body>
        <div class="container">
            <h1 class="title"><span>Computational Imaging</span> at Cornell.</h1>
            <picture>
                <source type="image/avif"
                    srcset="/relight-field/standard/poster.avif?v=5 720w, /relight-field/high/poster.avif?v=5 1440w"
                    sizes="(max-width: 720px) 100vw, 720px">
                <img class="portrait" id="portraitPoster"
                    src="/relight-field/standard/poster.webp?v=5"
                    srcset="/relight-field/standard/poster.webp?v=5 720w, /relight-field/high/poster.webp?v=5 1440w"
                    sizes="(max-width: 720px) 100vw, 720px"
                    width="720" height="466" fetchpriority="high" decoding="async"
                    alt="Shamus Li">
            </picture>
            <canvas class="portrait" id="portraitRelight" role="img" aria-label="Interactive portrait of Shamus Li" hidden>Shamus Li</canvas>
            <div class="relight-field" id="relightField" hidden>
                <button class="relight-handle" type="button" aria-label="Move portrait light"></button>
            </div>
        </div>
        <div id="header">
            <div id="name">Shamus Li</div>
            <div>
                <a href="/work/">Work</a>
                <a href="/shamus-cv.pdf">CV</a>
                <a href="https://www.linkedin.com/in/shamus-li/">LinkedIn</a>
            </div>
        </div>
    </body>
</html>
